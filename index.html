<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Instagram Reel Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Paste Your Instagram Reel Link</h2>
        <input type="text" id="reelLink" placeholder="e.g., www.instagram.com...">
        <button onclick="displayReel()">View Reel</button>
        <div class="viewer-container" id="viewer">
            <!-- The reel will appear here dynamically -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
